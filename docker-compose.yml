version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: justgold_api
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongo:27017/justgold-db
    command: npm run dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/v1/health || curl -f https://apidev.gwarm.net/api/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:6
    container_name: justgold_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: justgold_redis
    ports:
      - "6379:6379"

volumes:
  mongo_data: